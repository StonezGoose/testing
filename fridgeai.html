<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FridgeAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #video-container { width: 100%; max-width: 400px; position: relative; }
  video { width: 100%; display: block; }
  #result { font-size: 28px; font-weight: bold; text-align: center; padding: 16px; color: #4ade80; }
  #confidence { font-size: 16px; text-align: center; color: #aaa; padding-bottom: 8px; }
  #status { font-size: 14px; text-align: center; color: #facc15; padding: 12px; }
</style>
</head>
<body>

<div id="status">Loading model...</div>
<div id="video-container">
  <video id="webcam" autoplay playsinline muted></video>
</div>
<div id="result">--</div>
<div id="confidence"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/j_tmfxXnf/";
let model, webcam, running = false;

async function init() {
  document.getElementById("status").textContent = "Loading model...";
  try {
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    document.getElementById("status").textContent = "Starting camera...";
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    const video = document.getElementById("webcam");
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      document.getElementById("status").textContent = "Ready";
      running = true;
      loop();
    };
  } catch (err) {
    document.getElementById("status").textContent = "Error: " + err.message;
  }
}

async function loop() {
  if (!running) return;
  const video = document.getElementById("webcam");
  const predictions = await model.predict(video);
  let best = predictions.reduce((a, b) => a.probability > b.probability ? a : b);
  document.getElementById("result").textContent = best.className;
  document.getElementById("confidence").textContent = Math.round(best.probability * 100) + "% confidence";

  // Send result to App Inventor
  if (window.AppInventor) {
    window.AppInventor.setWebViewString(best.className + "|" + Math.round(best.probability * 100));
  }

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>

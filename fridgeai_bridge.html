<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; background: #000; }
  video { width: 100%; height: 100vh; object-fit: cover; display: block; }
  #label { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; 
           font-size: 24px; font-weight: bold; color: 
#4ade80; 
           text-shadow: 0 0 10px #000; font-family: sans-serif; }
  #caminfo { position: fixed; top: 10px; left: 0; right: 0; text-align: center;
             font-size: 12px; color: #fff; font-family: sans-serif; }
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted></video>
<div id="label">Loading...</div>
<div id="caminfo"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/j_tmfxXnf/";
let model;
async function init() {
  model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  const video = document.getElementById("webcam");
  let stream = null;
  // Try 1: exact environment
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { exact: "environment" } }, audio: false 
    });
    document.getElementById("caminfo").textContent = "Using: exact environment";
  } catch(e1) {
    // Try 2: prefer environment
    try {
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" }, audio: false 
      });
      document.getElementById("caminfo").textContent = "Using: prefer environment";
    } catch(e2) {
      // Try 3: any camera
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        document.getElementById("caminfo").textContent = "Using: any camera";
      } catch(e3) {
        document.getElementById("label").textContent = "Camera error: " + e3.message;
        return;
      }
    }
  }
  video.srcObject = stream;

  // Show which camera track is active
  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings();
  document.getElementById("caminfo").textContent += " | facing: " + (settings.facingMode || "unknown");

  video.onloadedmetadata = () => { video.play(); loop(); };
}
async function loop() {
  const video = document.getElementById("webcam");
  const predictions = await model.predict(video);
  const best = predictions.reduce((a, b) => a.probability > b.probability ? a : b);
  const label = best.className;
  const confidence = Math.round(best.probability * 100);
  document.getElementById("label").textContent = label + " (" + confidence + "%)";
  try { window.AppInventor.setWebViewString(label + "|" + confidence); } catch(e) {}
  document.title = label + "|" + confidence;
  requestAnimationFrame(loop);
}
init().catch(err => {
  document.getElementById("label").textContent = "Error: " + err.message;
});
</script>
</body>
</html>

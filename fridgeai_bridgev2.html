<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  video { width: 100%; height: 100vh; object-fit: cover; display: block; }
  #label { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; 
           font-size: 24px; font-weight: bold; color: #4ade80; 
           text-shadow: 0 0 10px #000; font-family: sans-serif; }
  #status { position: fixed; top: 10px; left: 0; right: 0; text-align: center;
            font-size: 12px; color: #fff; font-family: sans-serif; 
            padding: 4px; background: rgba(0,0,0,0.5); }
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted></video>
<div id="label">--</div>
<div id="status">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
document.title = "scanning|0";
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/j_tmfxXnf/";
let model;

async function startApp() {
  try {
    document.getElementById("status").textContent = "Loading model...";
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

    document.getElementById("status").textContent = "Starting camera...";
    
    // Request permission first, then enumerate to find rear camera
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    tempStream.getTracks().forEach(t => t.stop());
    
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');
    
    // Try to find rear camera by label
    let backCamera = cameras.find(d => 
      d.label.toLowerCase().includes('back') || 
      d.label.toLowerCase().includes('rear') ||
      d.label.toLowerCase().includes('environment')
    );
    // If not found by label, take the last camera (usually rear on Android)
    if (!backCamera) backCamera = cameras[cameras.length - 1];

    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { deviceId: { exact: backCamera.deviceId } }, 
      audio: false 
    });

    const video = document.getElementById("webcam");
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      document.getElementById("status").textContent = "Ready! Camera: " + backCamera.label;
      loop();
    };
  } catch(err) {
    document.getElementById("status").textContent = "ERROR: " + err.message;
  }
}

async function loop() {
  const video = document.getElementById("webcam");
  const predictions = await model.predict(video);
  const best = predictions.reduce((a, b) => a.probability > b.probability ? a : b);
  const label = best.className;
  const confidence = Math.round(best.probability * 100);

  document.getElementById("label").textContent = label + " (" + confidence + "%)";

  // Only send to App Inventor if NOT empty/unknown and confidence > 70%
  if (label !== "Empty/unknown" && confidence > 70) {
    document.title = label + "|" + confidence;
    try { window.AppInventor.setWebViewString(label + "|" + confidence); } catch(e) {}
  } else {
    document.title = "scanning|0";
    try { window.AppInventor.setWebViewString("scanning|0"); } catch(e) {}
  }

  requestAnimationFrame(loop);
}

window.addEventListener("load", startApp);
</script>
</body>
</html>
